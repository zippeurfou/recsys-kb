# Concept vocabulary for the recsys industry knowledge base.
# Format:  canonical-slug: [alias, alias, ...]
# - Aliases and slugs are matched case-insensitively with '-' treated as space.
# - This file is the ONLY vocabulary-dependent input to canonicalization.
#   Editing it and re-running `--canonicalize` retroactively re-tags all papers
#   WITHOUT re-reading them (see design doc section 8).
# - Grow it by reviewing `unmapped_concepts.md` and promoting frequent terms.

two-tower-retrieval: [two-tower, two tower, dual-encoder, dual encoder, two-tower model, two tower model]
