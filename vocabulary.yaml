negative-sampling: [in-batch negatives, in-batch negative sampling, hard negative mining, negative sampling]
calibration: [probability calibration, calibrated ranking, ranking calibration]
knowledge-distillation: [distillation, teacher-student, knowledge distillation]
multi-task-learning: [mmoe, ple, multi-gate mixture-of-experts, multi-task, multitask learning]
target-attention: [din, deep interest network, target attention, user interest modeling]
whole-page-optimization: [page-level optimization, slate optimization, whole page optimization]
rl-for-recsys: [rl post-training, reinforcement learning recommendation, bandits, contextual bandits]
